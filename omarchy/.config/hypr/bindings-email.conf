# Stock Omarchy: Super+Shift+E → HEY. One Superhuman window per workspace per profile.
# Launchers: superhuman-work / superhuman-personal (Chrome; workspace-scoped focus).
unbind = SUPER SHIFT, E
bindd = SUPER SHIFT, E, Superhuman Work, exec, superhuman-work
bindd = SUPER SHIFT ALT, E, Superhuman Personal, exec, superhuman-personal
