# Stock Omarchy: Super+Shift+E → HEY. One Superhuman per Chromium profile.
# Focus existing Chrome app window (class includes profile) or launch.
unbind = SUPER SHIFT, E
bindd = SUPER SHIFT, E, Superhuman Work, exec, omarchy-launch-or-focus-webapp mail.superhuman.com__-Default https://mail.superhuman.com --profile-directory=Default
bindd = SUPER SHIFT ALT, E, Superhuman Personal, exec, omarchy-launch-or-focus-webapp mail.superhuman.com__-Profile_1 https://mail.superhuman.com --profile-directory="Profile 1"
