# Hyper key window navigation (Caps Lock → Ctrl+Alt+Shift+Super via keyd)
# Synced from omarchy/.config/hypr/bindings-hyper.conf
#
# Layering: see omarchy/README.md "Key input layering".
# Cmd+Left/Right stays Mac line nav (keyd Home/End). Window focus is Hyper+arrows
# so Super+arrows are not stolen from tiling and line-nav can stay below Hyprland.

bindd = SUPER CTRL ALT SHIFT, LEFT, Focus left (Hyper), movefocus, l
bindd = SUPER CTRL ALT SHIFT, RIGHT, Focus right (Hyper), movefocus, r
bindd = SUPER CTRL ALT SHIFT, UP, Focus up (Hyper), movefocus, u
bindd = SUPER CTRL ALT SHIFT, DOWN, Focus down (Hyper), movefocus, d

# Voxtype dictation toggle (stock also has Super+Ctrl+X and F9 push-to-talk).
bindd = SUPER CTRL ALT SHIFT, D, Toggle dictation (Hyper), exec, voxtype record toggle

# Fullscreen — stock tiling-v2 is Super+F.
# keyd already rewrites Cmd+F → Ctrl+F (search), so Super+F never reaches Hyprland
# when using the Cmd key. Hyper+F owns fullscreen (works on dwindle + scrolling).
unbind = SUPER, F
bindd = SUPER CTRL ALT SHIFT, F, Full screen (Hyper), fullscreen, 0
