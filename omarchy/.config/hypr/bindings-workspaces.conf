# Workspace switch: stock Omarchy uses Super+1..0 (tiling-v2.conf).
# Move to Hyper (Caps → Ctrl+Alt+Shift+Super via keyd) so Super+number is free.
#
# Wayland/Hyprland name: workspaces (not macOS "Spaces").
#
# Super+Shift+number (move window to workspace) is unchanged — Hyper already
# includes Shift, so Hyper+Shift+N is not a distinct chord.
#
# Super+Ctrl+Left/Right: prev/next existing workspace (Windows Win+Ctrl arrows
# parity). Same e±1 as stock Super+Tab / Super+Shift+Tab (Tab was rebound).
# keyd only remaps bare Cmd+arrows → Home/End; Ctrl chords keep real arrows.

# Unbind stock Super+[1-9; 0] workspace switches (xkb codes 10-19)
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19

# Super+Ctrl+Left/Right → prev/next workspace (among existing)
bindd = SUPER CTRL, left, Previous workspace, workspace, e-1
bindd = SUPER CTRL, right, Next workspace, workspace, e+1

# Hyper + [1-9; 0] → switch workspace
bindd = SUPER CTRL ALT SHIFT, code:10, Switch to workspace 1 (Hyper), workspace, 1
bindd = SUPER CTRL ALT SHIFT, code:11, Switch to workspace 2 (Hyper), workspace, 2
bindd = SUPER CTRL ALT SHIFT, code:12, Switch to workspace 3 (Hyper), workspace, 3
bindd = SUPER CTRL ALT SHIFT, code:13, Switch to workspace 4 (Hyper), workspace, 4
bindd = SUPER CTRL ALT SHIFT, code:14, Switch to workspace 5 (Hyper), workspace, 5
bindd = SUPER CTRL ALT SHIFT, code:15, Switch to workspace 6 (Hyper), workspace, 6
bindd = SUPER CTRL ALT SHIFT, code:16, Switch to workspace 7 (Hyper), workspace, 7
bindd = SUPER CTRL ALT SHIFT, code:17, Switch to workspace 8 (Hyper), workspace, 8
bindd = SUPER CTRL ALT SHIFT, code:18, Switch to workspace 9 (Hyper), workspace, 9
bindd = SUPER CTRL ALT SHIFT, code:19, Switch to workspace 10 (Hyper), workspace, 10
