# Vicinae — third-party Raycast-style launcher (https://vicinae.com).
# Server: systemctl --user enable --now vicinae.service (uwsm-friendly).
# Super+Space stays Walker (stock Omarchy). Ctrl+Space → Vicinae.

bindd = CTRL, SPACE, Launch apps (Vicinae), exec, ~/.local/bin/vicinae toggle

# Layer polish (Hyprland 0.53+ named rules)
layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

layerrule {
    name = vicinae-no-animation
    no_anim = on
    match:namespace = vicinae
}
