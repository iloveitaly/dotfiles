# Window / column resizing (scrolling layout): cycle active column through
# explicit_column_widths (see looknfeel.conf). SUPER CTRL ALT (no Shift) —
# not Hyper (which adds Shift).
# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
#
# home/end: keyd maps bare Cmd+Left/Right → Home/End; if Ctrl+Option fails to
# keep the arrow key, these still fire the same cycle (see etc/keyd/default.conf).

bindd = SUPER CTRL ALT, left, Cycle narrower column, layoutmsg, colresize -conf
bindd = SUPER CTRL ALT, right, Cycle wider column, layoutmsg, colresize +conf
bindd = SUPER CTRL ALT, home, Cycle narrower column, layoutmsg, colresize -conf
bindd = SUPER CTRL ALT, end, Cycle wider column, layoutmsg, colresize +conf

# Cmd+Option+Ctrl+S → swap active window one step left (scrolling columns).
# Same action as stock Super+Shift+Left. keyd [cmd+control+alt] must pass S
# through as M-C-A-s (see etc/keyd/default.conf).
bindd = SUPER CTRL ALT, S, Swap window left, swapwindow, l
