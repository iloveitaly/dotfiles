# 1Password Quick Access — match macOS: Cmd+Shift+Space.
# Wayland can't register app global shortcuts; Hyprland must own the bind.
# https://support.1password.com/keyboard-shortcuts/
#
# Stock Omarchy: Super+Shift+Space = toggle Waybar (utilities.conf) — unbound below.
# Super+Shift+/ Passwords launcher removed earlier.
# (Cmd = Super via keyd: physical Alt next to space.)

unbind = SUPER SHIFT, SLASH
unbind = SUPER SHIFT, SPACE

bindd = SUPER SHIFT, SPACE, Open 1Password Quick Access, exec, 1password --quick-access
