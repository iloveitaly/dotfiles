# Clipboard history (Walker) — Omarchy default is SUPER+CTRL+V.
# Remap to Cmd+Shift+C (macOS-ish); frees the awkward Super+Ctrl chord.
#
# Layering: C/V/X stay Hyprland sendshortcut (stock + this file), not keyd.
# keyd must not rewrite C or Super+Shift+C never reaches this bind.
# See omarchy/README.md "Key input layering".
#
# Note: SUPER+SHIFT+C was Calendar in ~/.config/hypr/bindings.conf — unbound below.

unbind = SUPER SHIFT, C
bindd = SUPER SHIFT, C, Clipboard history, exec, omarchy-launch-walker -m clipboard
