# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # border_size = 0

    # CSS-style gaps_out: top, right, bottom, left — flush L/R, keep vertical pad
    gaps_out = 10, 0, 10, 0

    # Change to niri-like side-scrolling layout
    layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # Full-width default (stock Omarchy is 0.49 ≈ two columns + side slack).
    # 1.0 = one column edge-to-edge; adjacent columns are fully off-screen.
    column_width = 1.0
    # Don't force a lone column fullscreen — colresize ±conf owns width.
    fullscreen_on_one_column = false
    # Cycle with Super+Ctrl+Alt+Left/Right (bindings-window-resizing.conf).
    # Includes 1.0 so full-width stays on the ring after narrowing.
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
}
