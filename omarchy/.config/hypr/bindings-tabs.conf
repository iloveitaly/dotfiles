# Browser / terminal tab chords (macOS-style Cmd). Super stays Super for Hyprland.
#
# Flag `n` = non-consuming: Super+key also reaches the focused app.
#   - Ghostty: super+t/w/1..9 in config.local (native). Scripts no-op for Ghostty.
#   - Browsers: ignore Super+…; cmd-*-tab.sh injects Ctrl+… via wtype.
# Super+L stays consuming (location bar / layout fallback).
#
# Stock: Super+T = float (tiling-v2) — unbound here for Cmd+T new tab.
# Super+W = killactive → Super+Q (bindings-close.conf).
# Workspace Super+1..0 → Hyper+1..0 (bindings-workspaces.conf).

unbind = SUPER, T
unbind = SUPER, W
unbind = SUPER, L

binddn = SUPER, T, New tab, exec, ~/.config/hypr/scripts/cmd-new-tab.sh
binddn = SUPER, W, Close tab, exec, ~/.config/hypr/scripts/cmd-close-tab.sh
bindd = SUPER, L, Location bar / layout toggle, exec, ~/.config/hypr/scripts/cmd-location-bar.sh

# Cmd+1..9 select tab (xkb keycodes 10–18 = digits 1–9)
binddn = SUPER, code:10, Select tab 1, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 1
binddn = SUPER, code:11, Select tab 2, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 2
binddn = SUPER, code:12, Select tab 3, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 3
binddn = SUPER, code:13, Select tab 4, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 4
binddn = SUPER, code:14, Select tab 5, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 5
binddn = SUPER, code:15, Select tab 6, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 6
binddn = SUPER, code:16, Select tab 7, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 7
binddn = SUPER, code:17, Select tab 8, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 8
binddn = SUPER, code:18, Select tab 9, exec, ~/.config/hypr/scripts/cmd-select-tab.sh 9
