# Close window — Omarchy default is SUPER+W.
# Remap to Cmd+Q (macOS-style quit). SUPER+W is left unbound so apps
# can use it for in-app close-tab if they handle Super+W.
#
# Layering: WM action → Hyprland, not keyd. keyd leaves Q as Super.
# See omarchy/README.md "Key input layering".

unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive,
