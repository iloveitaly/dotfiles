# Stock Omarchy shortcuts we intentionally drop (no replacement bind in this file).
# Pure-unbind overlays live here; rebinds stay next to their new binds.

# --- Background menu ---
# Stock (utilities.conf): Super+Ctrl+Space → omarchy-menu background.
# Theme menu (Super+Shift+Ctrl+Space) stays.
unbind = SUPER CTRL, SPACE

# --- Spotify ---
# Stock (bindings.conf): Super+Shift+M → Spotify (omarchy-launch-or-focus spotify).
unbind = SUPER SHIFT, M

# --- Web apps (stock bindings.conf) ---
# Super+Shift+X     → X (https://x.com/)
# Super+Shift+Alt+X → X compose post (https://x.com/compose/post)
# Super+Shift+P     → Google Photos
unbind = SUPER SHIFT, X
unbind = SUPER SHIFT ALT, X
unbind = SUPER SHIFT, P

# --- Terminal launch / Ghostty-native chords ---
# Stock (bindings.conf): Super+Return → new terminal.
# Launch via Super+Space / Walker instead. Super+Alt+Return (tmux) kept.
unbind = SUPER, RETURN

# Ghostty native splits (config.local: super+d / super+shift+d).
# Stock (bindings.conf): Super+Shift+D → Docker (lazydocker).
unbind = SUPER SHIFT, D

# Ghostty pane focus: Cmd+Option+arrows (config.local: super+alt+arrow_*).
# Stock (tiling-v2): Super+Alt+arrows → moveintogroup.
# Groups still available via Super+G / Super+Alt+G.
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
unbind = SUPER ALT, UP
unbind = SUPER ALT, DOWN

# --- Scratchpad ---
# Stock (tiling-v2): Super+S → toggle special:scratchpad (blurred overlay).
# Super+Alt+S → move window to scratchpad. Unused; free Super+S for apps / future save.
unbind = SUPER, S
unbind = SUPER ALT, S

# --- Pseudo window (dwindle-only) ---
# Stock (tiling-v2): Super+P → pseudo. No-op on scrolling layout; free Super+P for apps.
unbind = SUPER, P

# --- Keybindings menu ---
# Stock (utilities.conf): Super+K → omarchy-menu-keybindings.
# Free Super+K for apps (e.g. Slack jump, Cursor chords). Use Walker/omarchy menu instead.
unbind = SUPER, K
