# Entry point for omarchy/ overlays. hyprland.conf sources this file only.
# Order matters: bindings-tabs after bindings-workspaces (Super+1..9 = select tab).

source = ~/.config/hypr/bindings-1password.conf
source = ~/.config/hypr/bindings-clipboard.conf
source = ~/.config/hypr/bindings-close.conf
source = ~/.config/hypr/bindings-email.conf
source = ~/.config/hypr/bindings-hyper.conf
source = ~/.config/hypr/bindings-switcher.conf
source = ~/.config/hypr/bindings-unbind.conf
source = ~/.config/hypr/bindings-vicinae.conf
source = ~/.config/hypr/bindings-window-resizing.conf
source = ~/.config/hypr/bindings-workspaces.conf
source = ~/.config/hypr/bindings-tabs.conf
source = ~/.config/hypr/exec-keyd-mapper.conf
source = ~/.config/hypr/looknfeel.conf
