# Fuzzy switchers (Walker dmenu over hyprctl clients).
# Scripts: ~/.config/hypr/scripts/switch-{window,app}.sh
#
# Hyper+W   → open windows on the current workspace
# Cmd+Tab   → running applications (macOS-style; one entry per app class)
# Super+Space stays the stock app launcher (installable desktop apps).
#
# Stock Omarchy (tiling-v2): Super+Tab = next workspace — unbound below.
# Workspace next/prev: Super+Ctrl+Left/Right (bindings-workspaces.conf), plus
# Super+Shift+Tab / Super+Ctrl+Tab (stock) and Hyper+numbers.

# Unbind stock Super+Tab (was: Next workspace)
unbind = SUPER, TAB

bindd = SUPER CTRL ALT SHIFT, W, Switch window (Hyper), exec, ~/.config/hypr/scripts/switch-window.sh
bindd = SUPER, TAB, Switch running app (Cmd+Tab), exec, ~/.config/hypr/scripts/switch-app.sh
