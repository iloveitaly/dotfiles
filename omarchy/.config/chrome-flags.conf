--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-features=TouchpadOverscrollHistoryNavigation
--load-extension=~/.local/share/omarchy/default/chromium/extensions/copy-url
# Profile selection: do not set --profile-directory here.
# The AUR google-chrome wrapper expands flags without shell quoting, so
# "Profile 1" (display name: Personal) cannot be expressed safely.
# Default profile is Personal via ~/.local/bin/chrome-personal and the
# user google-chrome.desktop override (see omarchy Justfile / README).
