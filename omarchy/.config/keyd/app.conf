# Per-app overrides for keyd-application-mapper (must be running).
# Layering: see omarchy/README.md "Key input layering".
# Source: https://github.com/basecamp/omarchy/discussions/175
#
# Only listed chords rewrite. Unlisted Cmd+key still emits Super so Hyprland
# globals keep working while that app is focused (Space, K, Shift+Space, …).

# --- terminals: copy/paste / tabs need Ctrl+Shift ---
[alacritty]
cmd.t = C-S-t
cmd.w = C-S-w
cmd.leftbrace = C-S-tab
cmd.rightbrace = C-tab

[com-mitchellh-ghostty]
cmd.t = C-S-t
cmd.w = C-S-w
cmd.leftbrace = C-S-tab
cmd.rightbrace = C-tab
# Tab select Cmd+1..9: match macOS — leave unlisted so Super+digit reaches Ghostty
# (super+N=goto_tab in ghostty config). Do not rewrite to Ctrl like Chromium.
# Cmd layer rewrites bare arrows; keep Super+Alt+arrows for pane nav (goto_split).
cmd+alt.left = M-A-left
cmd+alt.right = M-A-right
cmd+alt.up = M-A-up
cmd+alt.down = M-A-down

# --- Chromium (and PWAs): selective Cmd → Ctrl (Mac browser muscle memory) ---
# History: Cmd+[ / ] → Alt+Left/Right (Linux Chrome back/forward)
# Prev/next tab: Cmd+Option+Left/Right, Cmd+Shift+[ / ] (Mac Chrome)
# Tab select: Cmd+1..9
# Core: t/w/l/n/r (new tab, close tab, location, window, reload)
# Ctrl+W → Ctrl+Backspace: macOS text delete-word (not close tab). Close tab is Cmd+W.
#
# Not remapped: Super+Space, Super+K, Super+Shift+Space (1P), etc.
# Workspace Super+N was moved to Hyper; Cmd+1..9 free for tabs here.

[chromium]
cmd.t = C-t
cmd.w = C-w
control.w = C-backspace
cmd.l = C-l
cmd.n = C-n
cmd.r = C-r
# History back / forward (Mac Cmd+[ / ])
cmd.leftbrace = A-left
cmd.rightbrace = A-right
# Prev/next tab (Mac Cmd+Shift+[ / ] and Cmd+Option+Left/Right)
# Option is physical Win → alt layer
cmd+shift.leftbrace = C-S-tab
cmd+shift.rightbrace = C-tab
cmd+alt.left = C-S-tab
cmd+alt.right = C-tab
cmd.1 = C-1
cmd.2 = C-2
cmd.3 = C-3
cmd.4 = C-4
cmd.5 = C-5
cmd.6 = C-6
cmd.7 = C-7
cmd.8 = C-8
cmd.9 = C-9

[google-chrome]
cmd.t = C-t
cmd.w = C-w
control.w = C-backspace
cmd.l = C-l
cmd.n = C-n
cmd.r = C-r
cmd.leftbrace = A-left
cmd.rightbrace = A-right
cmd+shift.leftbrace = C-S-tab
cmd+shift.rightbrace = C-tab
cmd+alt.left = C-S-tab
cmd+alt.right = C-tab
cmd.1 = C-1
cmd.2 = C-2
cmd.3 = C-3
cmd.4 = C-4
cmd.5 = C-5
cmd.6 = C-6
cmd.7 = C-7
cmd.8 = C-8
cmd.9 = C-9

# Chromium PWAs / web apps (class like chrome-chatgpt.com__-Default)
# Note: keyd-application-mapper normalizes class (non-alnum → -) before fnmatch.
[chrome-*]
cmd.t = C-t
cmd.w = C-w
control.w = C-backspace
cmd.l = C-l
cmd.n = C-n
cmd.r = C-r
cmd.leftbrace = A-left
cmd.rightbrace = A-right
cmd+shift.leftbrace = C-S-tab
cmd+shift.rightbrace = C-tab
cmd+alt.left = C-S-tab
cmd+alt.right = C-tab
cmd.1 = C-1
cmd.2 = C-2
cmd.3 = C-3
cmd.4 = C-4
cmd.5 = C-5
cmd.6 = C-6
cmd.7 = C-7
cmd.8 = C-8
cmd.9 = C-9

# Superhuman PWAs only (merged with chrome-* above).
# Mac Superhuman → Linux Ctrl chords: K command palette, Enter send, Up/Down navigate.
# Overrides global keyd Cmd+Up/Down → C-home/C-end while Superhuman is focused.
# Super+K still opens Omarchy keybindings outside Superhuman.
# Class e.g. chrome-mail.superhuman.com__-Profile_1 → chrome-mail-superhuman-com-profile-1
[chrome-mail-superhuman*]
cmd.k = C-k
cmd.enter = C-enter
cmd.up = C-up
cmd.down = C-down

# --- Slack desktop (class: slack) ---
# Mac Slack → Linux Ctrl chords. Super+K is unbound in Hyprland (bindings-unbind).
# Cmd+K jump-to / quick switcher; Cmd+1..9 workspace/sidebar shortcuts.
[slack]
cmd.k = C-k
cmd.1 = C-1
cmd.2 = C-2
cmd.3 = C-3
cmd.4 = C-4
cmd.5 = C-5
cmd.6 = C-6
cmd.7 = C-7
cmd.8 = C-8
cmd.9 = C-9

# --- Cursor (class: cursor) ---
# Match macOS: Cmd+K / Cmd+P → Ctrl+K / Ctrl+P (chord prefix / Quick Open).
# Super+K is unbound in Hyprland; Super+P unbound (was dwindle pseudo).
[cursor]
cmd.k = C-k
cmd.p = C-p
