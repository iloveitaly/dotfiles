PasswordAuthentication no
AuthenticationMethods publickey
PermitRootLogin no

# Wildcard listen so sshd starts before tailscale0 has an address. A packet to the
# Tailscale address still lands on this socket. Who may log in is the whitelist below.
ListenAddress 0.0.0.0
ListenAddress ::

# Tailscale CGNAT and ULA (not this host). Loopback is for local ssh.
# Any AllowUsers line is a whitelist. LAN prefixes are 20-allow-lan.conf, written
# by configure-ssh from the default-route iface (not tailscale0, not docker bridges).
AllowUsers *@127.0.0.1 *@::1 *@100.64.0.0/10 *@fd7a:115c:a1e0::/48
