# keyd config for Omarchy + Microsoft Ergonomic Keyboard
# Installed to: /etc/keyd/default.conf
#
# Layering policy (what belongs in keyd vs Hyprland): see omarchy/README.md
# "Key input layering". Short version: physical layout + Mac text rewrites
# that must not present as Super stay here; WM actions and sendshortcut
# (clipboard, close, Hyper focus) stay in ~/.config/hypr/bindings-*.conf.
#
# Layout (MS Ergonomic, left of space outward):  Ctrl | Win | Alt | space
# After remap (keyd virtual keyboard):           Ctrl | Alt | Super/Cmd | space
# Verified with keyd monitor — full write-up: omarchy/README.md
#   "Microsoft Ergonomic Keyboard (this host)"
#
# Goals:
#   1. Physical Alt (next to space) is Cmd/Super; Win (and compose) emit Alt.
#   2. macOS-style text editing on that Cmd key (discussion #175), without
#      stealing Super for unmapped combos (Super+Return, Super+K, etc.).
#   3. Caps Lock is Hyper (Ctrl+Alt+Shift+Meta) for WM chords that must not
#      collide with Cmd text editing — see Hyprland bindings-hyper.conf.
#
# How (2) works: the cmd layer defaults to Meta (:M). Only explicitly listed
# keys become Control/home chords; everything else still emits Super.
#
# Intentionally NOT remapped (leave for Hyprland / Super passthrough): C/V/X
# (clipboard), T (Cmd+T new tab via bindings-tabs.conf), Q (Cmd+Q close via
# bindings-close.conf), S (save — files open on the CLI, not GUI apps; keep
# Cmd+S distinct from Ctrl+S), W, etc.
# f = C-f (search) IS remapped — stock Super+F fullscreen is Hyper+F instead
# (bindings-hyper.conf). Do NOT move Cmd+arrows or A/Z/F to Hyprland without
# reading the README — Super+arrows are stock window focus; keyd Home/End is required.
#
# Comments stay on their own lines — some keyd versions reject trailing comments.

[ids]
*

[main]
# Physical Alt (outer, next to space) → Cmd layer (Super + Mac text shortcuts)
leftalt = layer(cmd)

# The two keys toward Ctrl from Cmd both become Alt
leftmeta = layer(alt)
compose = layer(alt)

# Caps Lock → Hyper (Ctrl+Alt+Shift+Super)
capslock = layer(hyper)

[cmd:M]
# --- macOS text editing (discussion #175) ---
a = C-a
# c/v/x intentionally NOT remapped here — Omarchy Hyprland already handles
# Super+C/V/X (clipboard.conf). Remapping c→C-insert made Super+Shift+C
# become Ctrl+Shift+Insert and blocked clipboard history (Cmd+Shift+C).
z = C-z
# s intentionally NOT remapped — no GUI save chord; CLI editors use Ctrl+S.
# Search (macOS Cmd+F). Fullscreen is Hyper+F, not Super+F.
f = C-f

# Line start / end (Mac Cmd+Left / Cmd+Right)
# Bare Cmd+arrows only — Ctrl/Option chords must keep arrows for Hyprland/Ghostty
# (otherwise Super+Ctrl+Alt+Left arrives as Super+Ctrl+Alt+Home and binds miss).
left = home
right = end

# Document start / end (Mac Cmd+Up / Cmd+Down)
up = C-home
down = C-end

# Select to line start / end (Mac Cmd+Shift+Left / Right)
leftshift+left = S-home
leftshift+right = S-end
rightshift+left = S-home
rightshift+right = S-end

# Select to document start / end (Mac Cmd+Shift+Up / Down)
leftshift+up = C-S-home
leftshift+down = C-S-end
rightshift+up = C-S-home
rightshift+down = C-S-end

# Super+Ctrl+arrows: keep arrows (layer :M adds Meta → M-C-left)
control+left = C-left
control+right = C-right
control+up = C-up
control+down = C-down

# Mac Option+Backspace / Option+Delete → delete previous / next word
# (Win/Compose are Alt). :A so Option still emits Alt for Hyprland SUPER+ALT chords.
[alt:A]
backspace = C-backspace
delete = C-delete

# --- Composite layers (must follow constituents) ---
# App mapper / multi-mod: without these, `keyd bind 'cmd+alt.*'` fails with
# "cmd+alt is not a valid layer". Composites ignore parent :M/:A — emit explicitly.

# Cmd+Option → Super+Alt+arrows (Ghostty pane nav; Chromium overrides in app.conf)
[cmd+alt]
left = M-A-left
right = M-A-right
up = M-A-up
down = M-A-down

# Super+Ctrl+Option+arrows → column resize (bindings-window-resizing.conf)
[cmd+control+alt]
left = M-C-A-left
right = M-C-A-right
up = M-C-A-up
down = M-C-A-down

# Super+Ctrl+arrows (no Option) — pass through if needed by other binds
[cmd+control]
left = M-C-left
right = M-C-right
up = M-C-up
down = M-C-down

# Hyper: holding Caps emits Ctrl+Alt+Shift+Meta on other keys.
# Hyprland binds these as SUPER CTRL ALT SHIFT chords.
[hyper:C-A-S-M]
