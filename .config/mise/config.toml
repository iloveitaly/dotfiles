[tools]
"jq" = "latest"
"go:github.com/karol-broda/snitch" = "latest"
"github:nnnkkk7/lazyactions" = "latest"
cargo-binstall = "latest"
"usage" = "latest"
"ast-grep" = "latest"
"cargo:fastmod" = "latest"
"cargo:markdown-extract-cli" = "latest"
"github:railwayapp/railpack" = "latest"
"github:railwayapp/cli" = "latest"
"dive" = "latest"
lnav = "latest"
# not sure why, but these verifications are not working right now
# "github:moby/buildkit" = "latest"
# latest stable — nightly rewrites the same tag and breaks mise.lock checksums
"aqua:micro-editor/micro" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:noborus/ov" = "latest"
"fd" = "latest"
"github:gitleaks/gitleaks" = "latest"
"github:iloveitaly/richclip" = "latest"
"github:googleworkspace/cli" = "latest" # gws
"1password-cli" = "latest"
fzf = "latest"
yazi = "latest"
qdns = "latest" # q is a modern dns tool
"github:harehare/mq" = "latest"
"github:dlvhdr/diffnav" = "latest"
"aqua:Wilfred/difftastic" = "latest"
"aqua:dandavison/delta" = "latest"
"github:eza-community/eza" = "latest"
azure-cli = "latest"
opentofu = "latest"
"pypi:aiautocommit" = "latest"

# navigation, search & shell productivity
ripgrep = "latest"
bat = "latest"
zoxide = "latest"
starship = "latest"
watchexec = "latest"
tealdeer = "latest"

# git & github
lazygit = "latest"
gh = "latest"

# containers
lazydocker = "latest"
ctop = "latest"
"github:mrjackwills/oxker" = "latest"
"github:moncho/dry" = "latest"

# data & text processing
yq = "latest"
sd = "latest"
"github:shshemi/tabiew" = "latest"

# system & disk inspection
dua = "latest"
dust = "latest"
duf = "latest"

# clipboard
"github:theimpostor/osc" = "latest"

# language and language tooling
direnv = "latest"
just = "latest"
uv = "latest"
pnpm = "latest"

# wait ~1mo before adopting new language releases
bun        = { version = "latest", minimum_release_age = "1mo" }
nodejs     = { version = "22",     minimum_release_age = "1mo" }
erlang     = { version = "28",     minimum_release_age = "1mo" }
elixir     = { version = "1",      minimum_release_age = "1mo" }
python     = { version = "3.14", minimum_release_age = "1mo" }
ruby       = { version = "3",      minimum_release_age = "1mo" }
rust       = { version = "latest", minimum_release_age = "1mo" }
golang     = { version = "latest", minimum_release_age = "1mo" }
zig        = { version = "latest", minimum_release_age = "1mo" }

"github:tbillington/kondo" = "latest"
hunk = "latest"

# Amazon Linux ships an older glibc than atuin's GNU release requires. Use its
# statically linked musl asset on Linux, while GitHub's normal asset selection
# remains in effect for macOS and other platforms.
[tools."github:atuinsh/atuin"]
version = "latest"

[tools."github:atuinsh/atuin".platforms.linux-x64]
asset_pattern = "*x86_64*musl*"

[tools."github:atuinsh/atuin".platforms.linux-arm64]
asset_pattern = "*aarch64*musl*"

[settings]
experimental = true

[settings.cargo]
binstall = true

[settings.pypi]
uvx = true


