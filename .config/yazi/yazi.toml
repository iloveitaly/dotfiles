[mgr]
show_hidden = true
# default [1, 4, 3] over-weights the current-dir column; favor the preview instead
ratio = [1, 3, 4]

# https://github.com/yazi-rs/plugins/tree/main/git.yazi
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
