# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$direnv\
$python\
${custom.novenv}\
$jobs\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
# https://github.com/iloveitaly/pure/commit/5b10ea778490ce1eeb215c49e00b44d5924d4e28#diff-40ce3705d282be66579b84dcb3daf96a192c8ea10f7fc5e6737a72979f010b1bR855
format = "$symbol\u00A0"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
stashed = "≡"
ignore_submodules = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

# Native replacement for custom.venv — detect_env_vars defaults to ["VIRTUAL_ENV"]
[python]
format = '[venv ](blue)'
detect_extensions = []
detect_files = []
detect_folders = []

# No native "missing venv" signal yet (https://github.com/starship/starship/issues/3251)
[custom.novenv]
description = "show indicator when venv is missing"
command = """
print "no-venv"
"""
when = '''[[ -f "requirements.txt" || -f "pyproject.toml" || -f "uv.lock" || -f "poetry.lock" || -f "Pipfile" || -f ".python-version" ]] && [[ -z "$VIRTUAL_ENV" ]]'''
format = '[$output ](red)'

[direnv]
format = '[$symbol($loaded/)($allowed)]($style) '
symbol = "D"
disabled = false
allowed_msg = ''
loaded_msg = ''
not_allowed_msg = '🚫 not allowed'
denied_msg = '❌ denied'
unloaded_msg = '📤 not loaded'
